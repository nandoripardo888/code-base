project:
  root: .
  index_path: .code-harness/index.db

files:
  use_gitignore: true
  max_file_size_bytes: 2000000
  ignored_patterns:
    - "**/target/**"
    - "**/node_modules/**"
    - "**/.git/**"

ripgrep:
  executable: rg
  timeout_seconds: 10

parsers:
  enabled: true
  timeout_seconds: 10
  startup_timeout_seconds: 10
  failure_threshold: 3
  circuit_reset_seconds: 60
  chunk_target_chars: 4000
  chunk_max_chars: 8000

semantic:
  enabled: false
  provider: local
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  model_cache: ~/.cache/code-harness/models
  batch_size: 16
  window_chars: 1500
  window_overlap_chars: 150
  timeout_seconds: 300
  system_trust: true
  ca_bundle: null

search:
  max_results: 50
  max_results_per_file: 5

context:
  default_max_tokens: 12000
  reserved_tokens: 0
  max_files: 12
  max_snippets: 20
  max_expansion_depth: 2

mcp:
  expose_index_commands: false
  expose_execution: false
  expose_powershell: false
  execution_elicitation_enabled: false
  # Explicit operator trust decision; disabled or local_interactive.
  execution_elicitation_trust_mode: disabled
  execution_elicitation_timeout_seconds: 120
  # Machine output: CODE_HARNESS_RESPONSE_DETAIL=compact (default).
  # Normal projections cap serialized data at 30000 characters.
  # Truncated responses report structured result/snippet/budget reason codes.
  # Optional deployment identity: CODE_HARNESS_BUILD_COMMIT=<git commit>.

execution:
  enabled: false
  backend: host_supervised
  # Free PowerShell execution requires CODE_HARNESS_EXECUTION_POWERSHELL=1.
  powershell_enabled: false
  # AST inspection and execution executable: CODE_HARNESS_POWERSHELL=pwsh
  powershell_executable: pwsh
  require_approval: true
  default_timeout_seconds: 60
  max_timeout_seconds: 1800
  max_output_bytes: 200000
  max_processes: 32
  # Non-blocking per-project limit: CODE_HARNESS_EXECUTION_MAX_CONCURRENT=1
  max_concurrent: 1
  approval_ttl_seconds: 600
  allow_elevated: false
  # State directory outside the project workspace:
  # home: ${CODE_HARNESS_HOME}/executions
  # audit database: <home>/<project_id>/execution.db
  home: null
