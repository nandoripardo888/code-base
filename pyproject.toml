[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "code-harness"
version = "0.5.0"
description = "Compact local MCP tools for shell, search, file edits, patches, and rollback"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "code-harness contributors" }]
dependencies = [
  "mcp>=1.28.1,<2",
  "PyJWT[crypto]>=2.8,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
parsers = [
  "tree-sitter>=0.26,<0.27",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-java>=0.23.5,<0.24",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23.2,<0.24",
]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
code-harness = "code_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_harness"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["code_harness"]
omit = [
  "*/code_harness/cli.py",
  "*/code_harness/__main__.py",
  "*/code_harness/mcp/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["code_harness"]
